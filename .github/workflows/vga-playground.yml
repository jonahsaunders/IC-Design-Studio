name: Verify VGA Playground
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit of the selected branch or tag
        type: string
        required: true
  push:
    tags: ['v*']
# Selected candidates retain all acceptance gates and are not cancelled by new pushes.
concurrency:
  group: candidate-vga-playground-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable acceptance candidate
        run: python scripts/ci_candidate.py
  preview:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Qt desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0 libgl1 libxtst6 libxkbfile1 libnss3 libasound2t64 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
          python -m pip install -r requirements.txt
      - name: Build and test pinned simulator
        run: python scripts/build_vga_playground.py --test
      - name: Test source exchange and local assets
        run: python -m unittest tests.test_digital_vga -v
      - name: Verify live embedded rendering and project lifecycle
        env:
          QT_QPA_PLATFORM: xcb
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
          QT_QUICK_BACKEND: software
        run: xvfb-run -a python tests/gui_digital_vga.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vga-playground-evidence
          path: build/digital-vga-ui

name: Reference design compatibility
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character SHA of the selected branch or tag to qualify
        required: true
        type: string
  push:
    tags: ['v*']
# Exhaustive evidence belongs to one immutable candidate. Routine merge checks
# run in the fast workflow; a selected acceptance run must finish independently.
concurrency:
  group: ci-reference-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the selected immutable candidate
        run: python scripts/ci_candidate.py
  rc-toolchain:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine build dependencies once for all five RC corners
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p build
          exec > >(tee build/reference-toolchain-setup.log) 2>&1
          trap 'status=$?; echo "Setup exit status: $status"; dpkg-query -W > build/reference-toolchain-packages.txt; exit "$status"' EXIT
          python scripts/reference_toolchain.py apt-sources --output build/reference-apt-sources
          apt_options=(-o "Dir::Etc::sourcelist=$PWD/build/reference-apt-sources/sources.list" -o "Dir::Etc::sourceparts=$PWD/build/reference-apt-sources/sources.list.d" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo timeout --signal=TERM --kill-after=15s 300s apt-get "${apt_options[@]}" update --error-on=any
          sudo timeout --signal=TERM --kill-after=15s 600s apt-get "${apt_options[@]}" install -y build-essential pkg-config m4 autoconf automake libtool bison flex tcl-dev tk-dev libx11-dev libxrender-dev libxpm-dev libcairo2-dev libglu1-mesa-dev libreadline-dev libsuitesparse-dev
      - name: Build the isolated patched extractor and pinned sparse solver once
        run: |
          python scripts/build_physical_engines.py --lock examples/gf180-rc-engine-lock.json --output build/gf180-engines
          python scripts/build_physical_engines.py --lock examples/modern-schematic-engine-lock.json --only ngspice --output build/modern-engines
      - name: Bind installed files and exact build inputs to this candidate
        id: pack
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python scripts/reference_toolchain.py pack --candidate "$CANDIDATE_SHA" --archive build/reference-toolchain.tar.gz
          echo "artifact_name=reference-rc-toolchain-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: |
            build/reference-toolchain.tar.gz
            build/reference-toolchain-manifest.json
            build/reference-toolchain-packages.txt
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-rc-toolchain-build-${{ github.run_attempt }}
          path: |
            build/gf180-engines/*-build.log
            build/gf180-engines/*-version.log
            build/gf180-engines/source-lock.json
            build/modern-engines/*-build.log
            build/modern-engines/*-version.log
            build/modern-engines/source-lock.json
            build/reference-toolchain-packages.txt
            build/reference-toolchain-setup.log
            build/reference-apt-sources
          compression-level: 1
          if-no-files-found: warn
  modern-schematic:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LDFranck/sky130_vbl_ip__overvoltage
          ref: 53cf579f63d34227af67f0189b49ee09185f1db5
          path: build/open-project-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config m4 autoconf automake libtool bison flex tcl-dev tk-dev libx11-dev libxrender-dev libxpm-dev libcairo2-dev libglu1-mesa-dev libreadline-dev libsuitesparse-dev libegl1 libopengl0 klayout
          python -m pip install -r requirements.txt
      - name: Build both exact modern schematic tools and stable physical tools
        run: |
          python scripts/build_physical_engines.py --lock examples/modern-schematic-engine-lock.json --output build/modern-engines
          python scripts/build_physical_engines.py --output build/physical-engines
      - name: Compare all six bandgap analyses through four paths
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/verify_bandgap_compatibility.py --output build/modern-bandgap --xschem "$PWD/build/modern-engines/installed/bin/xschem" --ngspice "$PWD/build/modern-engines/installed/bin/ngspice"
      - name: Qualify modern destination semantics
        env:
          QT_QPA_PLATFORM: offscreen
          ICSTUDIO_TEST_XSCHEM: ${{ github.workspace }}/build/modern-engines/installed/bin/xschem
        run: python -m unittest tests.test_external_exchange_engines -v
      - name: Prepare locked detector PDK
        run: python scripts/fetch_sky130_reference.py --physical-only --output build/qualification-pdk
      - name: Require detector LVS, injected faults and every modern trip code
        run: python scripts/qualify_open_project.py --source build/open-project-source --pdk build/qualification-pdk/sky130A --out build/modern-detector --require-consistent --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --ngspice "$PWD/build/modern-engines/installed/bin/ngspice"
      - name: Require fresh detector exchange through modern Xschem
        run: python scripts/qualify_reference_exchange.py --detector build/modern-detector --out build/modern-exchange --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --klayout /usr/bin/klayout --xschem "$PWD/build/modern-engines/installed/bin/xschem"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-modern-schematic
          path: |
            build/modern-bandgap
            build/modern-detector
            build/modern-exchange
            build/modern-engines/*-build.log
            build/modern-engines/*-version.log
            build/modern-engines/source-lock.json
          compression-level: 1
          if-no-files-found: error
  bandgap-rc:
    # RC reads committed layouts and its own pinned PDK; it consumes no output
    # from bandgap-physical. Both remain required for the whole workflow.
    needs: rc-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        corner: [nominal, ff, ss, fs, sf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RTimothyEdwards/open_pdks
          ref: aa3fc215a80d32437b8cca1cb3fdee819d18c4c9
          path: build/open-pdks
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies for fresh corner acceptance
        # A stalled package-index request previously consumed this job's entire
        # 210-minute extraction budget without running the qualification.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p build
          exec > >(tee build/reference-corner-setup.log) 2>&1
          trap 'status=$?; echo "Setup exit status: $status"; dpkg-query -W > build/reference-corner-packages.txt; exit "$status"' EXIT
          python scripts/reference_toolchain.py apt-sources --output build/reference-apt-sources
          apt_options=(-o "Dir::Etc::sourcelist=$PWD/build/reference-apt-sources/sources.list" -o "Dir::Etc::sourceparts=$PWD/build/reference-apt-sources/sources.list.d" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo timeout --signal=TERM --kill-after=15s 300s apt-get "${apt_options[@]}" update --error-on=any
          sudo timeout --signal=TERM --kill-after=15s 600s apt-get "${apt_options[@]}" install -y tcl tk libx11-6 libxrender1 libxpm4 libcairo2 libglu1-mesa libreadline8t64 libklu2 libegl1 libopengl0
          timeout --signal=TERM --kill-after=15s 300s python -m pip install --timeout 30 --retries 3 -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.rc-toolchain.outputs.artifact_name }}
          path: build/rc-toolchain-artifact
      - name: Verify producer checksum, candidate, platform, inputs and installed engines
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          TOOLCHAIN_SHA256: ${{ needs.rc-toolchain.outputs.sha256 }}
        run: |
          python scripts/reference_toolchain.py restore --candidate "$CANDIDATE_SHA" --archive build/rc-toolchain-artifact/reference-toolchain.tar.gz --expected-sha256 "$TOOLCHAIN_SHA256"
          dpkg-query -W > build/reference-corner-packages.txt
      - name: Require complete extraction, terminal equivalence, fill controls and post-RC startup
        run: python scripts/qualify_gf180_rc.py --open-pdks build/open-pdks --magic "$PWD/build/gf180-engines/installed/bin/magic" --ngspice "$PWD/build/modern-engines/installed/bin/ngspice" --corner "${{ matrix.corner }}" --out build/gf180-rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-bandgap-rc-${{ matrix.corner }}
          path: |
            build/gf180-rc
            build/gf180-engines/*-build.log
            build/gf180-engines/*-version.log
            build/gf180-engines/source-lock.json
            build/modern-engines/*-build.log
            build/modern-engines/*-version.log
            build/modern-engines/source-lock.json
            build/reference-toolchain-manifest.json
            build/reference-toolchain-restored.json
            build/reference-toolchain-mismatch.json
            build/reference-corner-packages.txt
            build/reference-corner-setup.log
            build/reference-apt-sources
          compression-level: 1
          if-no-files-found: error
  bandgap-schematic:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the destination schematic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xschem ngspice libegl1 libopengl0
          python -m pip install -r requirements.txt
      - name: Compare the real bandgap through Xschem and all Studio paths
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/verify_bandgap_compatibility.py --output build/bandgap-compatibility --xschem /usr/bin/xschem --ngspice /usr/bin/ngspice
      - name: Exercise the six analyses through the desktop
        env:
          QT_QPA_PLATFORM: offscreen
          ICSTUDIO_TEST_NGSPICE: /usr/bin/ngspice
        run: python tests/gui_bandgap_compatibility.py --evidence build/bandgap-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-bandgap-schematic
          path: |
            build/bandgap-compatibility
            build/bandgap-desktop
          compression-level: 1
          if-no-files-found: error
  bandgap-physical:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: efabless/globalfoundries-pdk-libs-gf180mcu_fd_pv
          ref: 05e7b6adf19edf942969c1c9625f02fd87874f06
          path: build/gf180-pv
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install KLayout and the locked Python dependencies
        run: |
          sudo apt-get update
          curl -fL --retry 3 -o /tmp/klayout.deb https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.5-1_amd64.deb
          echo '9f88fe45d1992fc9bd0ce986bbbe150ad198c6a59a86fc13343db822a5790e49  /tmp/klayout.deb' | sha256sum -c
          sudo apt-get install -y /tmp/klayout.deb libegl1 libopengl0
          python -m pip install -r requirements.txt docopt jinja2
      - name: Qualify exchange, full DRC/LVS and deliberate physical faults
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/qualify_gf180_exchange.py --pv build/gf180-pv --klayout /usr/bin/klayout --out build/gf180-exchange
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-bandgap-physical
          path: build/gf180-exchange
          compression-level: 1
          if-no-files-found: error

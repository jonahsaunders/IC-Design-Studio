name: External tool interoperability
on:
  workflow_call:
  push:
    branches: [main, experimental]
  pull_request:
  workflow_dispatch:
# Replace obsolete branch/PR checks. A distinct file prefix prevents reusable
# workflows from cancelling their callers; release preparation, tags and manual
# runs use a unique run id so their acceptance evidence can finish.
concurrency:
  group: >-
    ci-interoperability-${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.workflow != 'Prepare desktop release' && github.ref) || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  exchange:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      ICSTUDIO_EXCHANGE_EVIDENCE: build/external-exchange-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install destination tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xschem magic ngspice libegl1 libopengl0
          python -m pip install -r requirements.txt
          command -v xschem
          command -v magic
          echo "ICSTUDIO_TEST_NGSPICE=$(command -v ngspice)" >> "$GITHUB_ENV"
      - name: Verify contracts and real external exchanges
        run: python -m unittest tests.test_checkout_integrity tests.test_external_tools tests.test_interoperability tests.test_klayout_lvs_exchange tests.test_pdk_templates tests.test_external_exchange_engines tests.test_native_migration -v
      - name: Verify secondary technology selection and conflict resolution
        run: python tests/gui_interoperability.py
      - name: Compare native hierarchy with independent Xschem netlisting
        run: python scripts/verify_native_hierarchy.py --require-xschem --output build/native-hierarchy-exchange-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interoperability-ui-evidence
          path: |
            build/gui-interoperability/*.png
            build/external-exchange-evidence
            build/native-hierarchy-exchange-evidence

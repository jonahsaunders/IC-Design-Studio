name: External tool interoperability
on:
  pull_request:
    paths: ['icstudio/**', 'tests/**', 'requirements.txt', '.github/workflows/interoperability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exchange:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install destination tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xschem magic ngspice libegl1 libopengl0
          python -m pip install -r requirements.txt
          command -v xschem
          command -v magic
          echo "ICSTUDIO_TEST_NGSPICE=$(command -v ngspice)" >> "$GITHUB_ENV"
      - name: Verify contracts and real external exchanges
        run: python -m unittest tests.test_interoperability tests.test_klayout_lvs_exchange tests.test_pdk_templates tests.test_external_exchange_engines tests.test_native_migration -v
      - name: Verify secondary technology selection and conflict resolution
        run: python tests/gui_interoperability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interoperability-ui-evidence
          path: build/gui-interoperability/*.png

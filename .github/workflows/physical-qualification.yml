name: Pinned SKY130 physical qualification
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, experimental]
  pull_request:
# Replace obsolete branch/PR checks. A distinct file prefix prevents reusable
# workflows from cancelling their callers; release preparation, tags and manual
# runs use a unique run id so their acceptance evidence can finish.
concurrency:
  group: >-
    ci-physical-qualification-${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.workflow != 'Prepare desktop release' && github.ref) || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qualification:
    name: qualify (${{ matrix.stage }})
    strategy:
      fail-fast: false
      matrix:
        stage: [inverter, analog, analog-rc, hierarchy-rc, devices, bipolar, two-stage-opamp, detector, public-layouts]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.stage == 'two-stage-opamp' && 90 || matrix.stage == 'detector' && 60 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install physical engines and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config m4 tcl-dev tk-dev libx11-dev libxrender-dev libxpm-dev libcairo2-dev libglu1-mesa-dev ngspice klayout xschem libegl1 libopengl0
          python -m pip install -r requirements.txt
      - name: Install the pinned native RF geometry checker
        if: matrix.stage == 'devices'
        run: |
          curl -fL --retry 3 -o /tmp/rf-klayout.deb https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.5-1_amd64.deb
          echo '9f88fe45d1992fc9bd0ce986bbbe150ad198c6a59a86fc13343db822a5790e49  /tmp/rf-klayout.deb' | sha256sum -c
          sudo apt-get install -y /tmp/rf-klayout.deb
      - name: Build compatible pinned Magic and Netgen
        run: python scripts/build_physical_engines.py --output build/physical-engines
      - name: Build the verified simulator for externally included model decks
        if: matrix.stage == 'inverter' || matrix.stage == 'detector'
        run: |
          sudo apt-get install -y autoconf automake libtool bison flex libreadline-dev libsuitesparse-dev
          python scripts/build_physical_engines.py --lock examples/modern-schematic-engine-lock.json --only ngspice --output build/simulation-engine
          python scripts/verify_ngspice_diode_sequences.py --ngspice "$PWD/build/simulation-engine/installed/bin/ngspice" --output build/simulation-engine/diode-sequences
      - name: Qualify public RF reverse-bias current, admittance and noise
        if: matrix.stage == 'inverter'
        run: python scripts/qualify_sky130_rf_bias.py --ngspice "$PWD/build/simulation-engine/installed/bin/ngspice" --output build/simulation-engine/rf-bias
      - name: Qualify public RF reverse pulses and timestep convergence
        if: matrix.stage == 'inverter'
        run: python scripts/qualify_sky130_rf_transient.py --ngspice "$PWD/build/simulation-engine/installed/bin/ngspice" --output build/simulation-engine/rf-transient
      - name: Check published SKY130 MOS bias limits and deliberate binding faults
        if: matrix.stage == 'inverter'
        timeout-minutes: 10
        run: |
          python -m unittest tests.test_sky130_mos_bias -v
          python scripts/qualify_sky130_mos_bias.py --pilot --workers 2 --ngspice "$PWD/build/simulation-engine/installed/bin/ngspice" --output build/sky130-mos-bias
      - name: Check fresh SKY130 MOS defaults against independent model calls
        if: matrix.stage == 'inverter'
        timeout-minutes: 10
        run: |
          python -m unittest tests.test_sky130_mos_defaults -v
          python scripts/qualify_sky130_mos_defaults.py --pilot --workers 2 --ngspice "$PWD/build/simulation-engine/installed/bin/ngspice" --output build/sky130-mos-defaults
      - name: Cache checksummed upstream archives
        uses: actions/cache@v4
        with:
          path: build/sky130-downloads
          key: sky130-physical-${{ hashFiles('examples/sky130-reference-assets.json') }}
      - name: Fetch pinned physical inputs
        run: python scripts/fetch_sky130_reference.py --physical-only --output build/qualification-pdk
      - name: Recreate the locked adapter
        run: python scripts/prepare_sky130_qualification.py --input build/qualification-pdk/sky130A --output build/physical-adapter/sky130A
      - name: Require explicit RF p-well substrate connectivity and fault detection
        if: matrix.stage == 'devices'
        run: python scripts/qualify_sky130_rf_isolation.py --sky130 build/physical-adapter/sky130A --klayout /usr/bin/klayout --output build/rf-isolation-evidence --pilot
      - name: Check the public RF n-well opening spacing boundary
        if: matrix.stage == 'devices'
        run: python scripts/qualify_sky130_rf_isolation_boundaries.py --sky130 build/physical-adapter/sky130A --klayout /usr/bin/klayout --output build/rf-isolation-boundaries --pilot
      - name: Verify threshold implants and native MOS model recognition
        if: matrix.stage == 'devices'
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
          ICSTUDIO_TEST_NGSPICE: /usr/bin/ngspice
        run: |
          python -m unittest tests.test_sky130_threshold_layouts -v
          python scripts/qualify_sky130_threshold_layouts.py --sky130 build/physical-adapter/sky130A --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --klayout /usr/bin/klayout --output build/threshold-layout-evidence --pilot
      - name: Verify thick-oxide and native voltage-device layouts
        if: matrix.stage == 'devices'
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
          ICSTUDIO_TEST_NGSPICE: /usr/bin/ngspice
        run: |
          python -m unittest tests.test_sky130_voltage_layouts -v
          python scripts/qualify_sky130_voltage_layouts.py --sky130 build/physical-adapter/sky130A --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --klayout /usr/bin/klayout --output build/voltage-layout-evidence --pilot
      - name: Prepare the separately versioned experimental PNP adapter
        if: matrix.stage == 'bipolar'
        run: python scripts/prepare_sky130_qualification.py --input build/qualification-pdk/sky130A --output build/bipolar-adapter/sky130A --bipolar
      - name: Qualify nominal inverter and deliberate DRC/LVS faults
        if: matrix.stage == 'inverter'
        timeout-minutes: 5
        run: python scripts/qualify_layout_process.py --pdk build/physical-adapter/sky130A --out build/physical-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --ngspice "$PWD/build/simulation-engine/installed/bin/ngspice"
      - name: Check exact full-deck width and spacing boundaries
        if: matrix.stage == 'inverter'
        timeout-minutes: 5
        run: python scripts/qualify_drc_boundaries.py --technology build/qualification-pdk/sky130A/libs.tech/magic/sky130A.tech --out build/physical-evidence/drc-boundaries --magic "$PWD/build/physical-engines/installed/bin/magic"
      - name: Exercise real desktop physical checks and repair
        if: matrix.stage == 'inverter'
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_physical_qualification.py --pdk build/physical-adapter/sky130A --out build/physical-evidence/desktop --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --ngspice "$PWD/build/simulation-engine/installed/bin/ngspice"
      - name: Qualify analog references, corners, extraction and deliberate faults
        if: matrix.stage == 'analog'
        timeout-minutes: 15
        run: python scripts/qualify_analog_process.py --pdk build/physical-adapter/sky130A --out build/analog-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen"
      - name: Qualify distributed RC across process, temperature and saved voltage sweeps
        if: matrix.stage == 'analog-rc'
        timeout-minutes: 35
        run: python scripts/qualify_analog_process.py --extraction rc --workers 4 --pdk build/physical-adapter/sky130A --out build/analog-rc-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen"
      - name: Qualify process passive devices, contacted guards and deliberate faults
        if: matrix.stage == 'devices'
        timeout-minutes: 20
        run: python scripts/qualify_sky130_devices.py --pdk build/physical-adapter/sky130A --out build/device-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen"
      - name: Compare transformed hierarchical RC to independently flattened geometry
        if: matrix.stage == 'hierarchy-rc'
        timeout-minutes: 5
        run: python scripts/qualify_hierarchical_rc.py --pdk build/physical-adapter/sky130A --out build/hierarchical-rc-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen"
      - name: Qualify fixed PNP multiplicity and reject altered emitter geometry
        if: matrix.stage == 'bipolar'
        timeout-minutes: 5
        run: python scripts/qualify_sky130_bipolar.py --pdk build/bipolar-adapter/sky130A --out build/bipolar-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen"
      - name: Qualify two-stage opamp before and after ECO across full PVT
        if: matrix.stage == 'two-stage-opamp'
        timeout-minutes: 65
        run: python scripts/qualify_two_stage_opamp.py --pdk build/physical-adapter/sky130A --output build/two-stage-opamp-evidence --extraction rc --full-pvt --workers 4 --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --ngspice /usr/bin/ngspice
      - name: Fetch the pinned public overvoltage source
        if: matrix.stage == 'detector'
        uses: actions/checkout@v4
        with:
          repository: LDFranck/sky130_vbl_ip__overvoltage
          ref: 53cf579f63d34227af67f0189b49ee09185f1db5
          path: build/open-project-source
          persist-credentials: false
      - name: Require detector strict LVS, fault detection and HSA simulation
        if: matrix.stage == 'detector'
        timeout-minutes: 22
        run: python scripts/qualify_open_project.py --source build/open-project-source --pdk build/qualification-pdk/sky130A --out build/open-project-evidence --require-consistent --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --ngspice "$PWD/build/simulation-engine/installed/bin/ngspice"
      - name: Verify detector streams after independent export and reimport
        if: matrix.stage == 'detector'
        timeout-minutes: 15
        run: python scripts/qualify_reference_exchange.py --detector build/open-project-evidence --out build/detector-exchange --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --klayout /usr/bin/klayout
      - name: Fetch the pinned standard-cell library for mixed public designs
        if: matrix.stage == 'public-layouts'
        run: python scripts/fetch_sky130_reference.py --output build/public-full-pdk --cache build/sky130-downloads
      - name: Build pinned Xschem for independent public schematic netlisting
        if: matrix.stage == 'public-layouts'
        run: python scripts/build_physical_engines.py --lock examples/modern-schematic-engine-lock.json --only xschem --output build/public-xschem
      - name: Require public source, Xschem, GDS, OASIS, DRC and LVS comparisons
        if: matrix.stage == 'public-layouts'
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/qualify_public_layouts.py --source build/public-sources --pdk build/physical-adapter/sky130A --standard-cells build/public-full-pdk/sky130A/libs.ref/sky130_fd_sc_hd/spice/sky130_fd_sc_hd.spice --xschem-libraries build/public-full-pdk/sky130A/libs.tech/xschem --out build/public-layout-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --xschem "$PWD/build/public-xschem/installed/bin/xschem"
      - name: Exercise public layouts through the desktop DRC and LVS action
        if: matrix.stage == 'public-layouts'
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_public_layouts.py --evidence build/public-layout-evidence --pdk build/physical-adapter/sky130A --out build/public-layout-evidence/desktop-linux --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky130-evidence-${{ matrix.stage }}
          path: |
            build/physical-evidence
            build/analog-evidence
            build/analog-rc-evidence
            build/device-evidence
            build/hierarchical-rc-evidence
            build/bipolar-evidence
            build/bipolar-adapter/sky130A/package.json
            build/bipolar-adapter/sky130A/PNP-EXTRACTION-UPDATE.json
            build/two-stage-opamp-evidence
            build/open-project-evidence
            build/detector-exchange
            build/public-layout-evidence
            build/public-xschem/*-build.log
            build/public-xschem/*-version.log
            build/public-xschem/source-lock.json
            build/physical-adapter/sky130A/package.json
            build/qualification-pdk/upstream-lock.json
            build/physical-engines/*-build.log
            build/physical-engines/*-version.log
            build/physical-engines/source-lock.json
            build/simulation-engine/*-build.log
            build/simulation-engine/*-version.log
            build/simulation-engine/source-lock.json
            build/simulation-engine/diode-sequences
            build/simulation-engine/rf-bias
            build/simulation-engine/rf-transient
            build/sky130-mos-defaults
            build/sky130-mos-bias
            build/rf-isolation-evidence
            build/rf-isolation-boundaries
            build/threshold-layout-evidence
            build/voltage-layout-evidence
          if-no-files-found: error

  detector-desktop:
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop and simulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libegl1 libopengl0
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: sky130-evidence-detector
          path: build
      - name: Exercise attachment and editing of the real project in Qt
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_open_project.py --schematic build/open-project-evidence/schematic.icproj --layout build/open-project-evidence/magic-import/imported.icproj --bench build/open-project-evidence/overvoltage-bench.icproj --out build/open-project-evidence/desktop
      - name: Exercise vias and Autovia on the imported detector
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_layout_vias.py --project build/open-project-evidence/overvoltage-bench.icproj --out build/open-project-evidence/vias
      - name: Record desktop gate identity
        if: always()
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python -c "import json, os, pathlib; pathlib.Path('build/desktop-gate.json').write_text(json.dumps({'commit':os.environ['SOURCE_COMMIT']}))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky130-evidence-desktop
          path: |
            build/open-project-evidence/desktop
            build/open-project-evidence/vias
            build/desktop-gate.json
          if-no-files-found: error

  # Retain the required check name and the artifact consumed by draft releases.
  sky130:
    needs: [qualification, detector-desktop]
    if: always()
    runs-on: ubuntu-24.04
    # The full evidence archive is several GiB; download, recompression and
    # upload need their own budget after the physical gates have passed.
    timeout-minutes: 30
    steps:
      - name: Require every physical and desktop gate
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          DESKTOP_RESULT: ${{ needs.detector-desktop.result }}
        run: test "$QUALIFICATION_RESULT" = success && test "$DESKTOP_RESULT" = success
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: sky130-evidence-*
          merge-multiple: true
          path: build/physical-evidence-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky130-physical-evidence
          path: build/physical-evidence-bundle
          compression-level: 1
          if-no-files-found: error

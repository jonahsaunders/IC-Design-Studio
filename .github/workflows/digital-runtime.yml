name: Build included digital runtime
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/digital-payload
          key: digital-runtime-${{ hashFiles('packaging/digital/**', 'scripts/build_digital_runtime.py', 'scripts/build_physical_engines.py', 'scripts/prepare_sky130_digital.py', 'scripts/fetch_sky130_reference.py', 'examples/physical-engine-lock.json', 'examples/sky130-reference-assets.json', 'icstudio/digital*.py', 'icstudio/model.py', 'licenses/Apache-2.0.txt', 'THIRD_PARTY_NOTICES.md') }}
      - name: Build the runtime filesystem
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python scripts/build_digital_runtime.py
          docker image rm icstudio-digital-runtime
          docker builder prune --force
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: build/digital-payload
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Verify native installation with no user tool configuration
        env:
          ICSTUDIO_DIGITAL_STATE: ${{ github.workspace }}/build/digital-state
        run: python scripts/qualify_digital_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-runtime-payload
          path: build/digital-payload
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-runtime-linux-evidence
          path: |
            build/digital-state/checks/*/report.json
            build/digital-state/checks/*/*/engine.log
            build/digital-state/checks/*/*/result.json
            build/digital-state/checks/*/*/backend-input.json
            build/digital-state/checks/*/*/*/engine.log
            build/digital-state/checks/*/*/*/result.json
            build/digital-state/checks/*/*/*/backend-input.json
            build/digital-state/checks/*/*/*/timing.json
            build/digital-state/checks/*/*/*/physical_metrics.json

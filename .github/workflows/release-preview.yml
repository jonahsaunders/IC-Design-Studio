name: Prepare draft preview release
on:
  workflow_dispatch:
  push:
    branches: [main, experimental]
    paths: [icstudio/__init__.py, icstudio/experimental_probe.py, icstudio/inductor_probe.py, icstudio/inductor_design_probe.py, scripts/assemble_prerelease.py, scripts/release_evidence.py, scripts/publish_prerelease.py, .github/workflows/build-desktop.yml, .github/workflows/release-preview.yml]
permissions:
  contents: read
concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental'
    uses: ./.github/workflows/build-desktop.yml
  interoperability:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental'
    uses: ./.github/workflows/interoperability.yml
  physical:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental'
    uses: ./.github/workflows/physical-qualification.yml
  digital:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental'
    uses: ./.github/workflows/digital.yml
  vga:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental'
    uses: ./.github/workflows/vga-playground.yml
  statistics:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental'
    uses: ./.github/workflows/analog-campaign-qualification.yml
  reference-compatibility:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental'
    uses: ./.github/workflows/reference-compatibility.yml
  draft:
    needs: [desktop, interoperability, physical, digital, vga, statistics, reference-compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build/release-inputs
      - name: Verify version, commit and every desktop asset
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/assemble_prerelease.py --input build/release-inputs --output release --commit "$RELEASE_COMMIT"
      - uses: actions/download-artifact@v4
        with:
          name: sky130-physical-evidence
          path: build/physical-release-evidence
      - name: Include physical and interoperability evidence
        uses: actions/download-artifact@v4
        with:
          name: interoperability-ui-evidence
          path: build/interoperability-release-evidence
      - name: Include digital qualification evidence
        uses: actions/download-artifact@v4
        with:
          pattern: digital-*-evidence
          path: build/digital-release-evidence
      - name: Include VGA source qualification evidence
        uses: actions/download-artifact@v4
        with:
          name: vga-playground-evidence
          path: build/vga-release-evidence
      - name: Include statistical campaign qualification evidence
        uses: actions/download-artifact@v4
        with:
          name: statistical-campaign-evidence
          path: build/statistics-release-evidence
      - name: Include real-reference compatibility evidence
        uses: actions/download-artifact@v4
        with:
          pattern: reference-*
          path: build/reference-release-evidence
      - name: Complete evidence archives and checksums
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_id }}
        run: python scripts/release_evidence.py package --commit "$RELEASE_COMMIT" --run-id "$RELEASE_RUN"
      - name: Create a reviewable draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: python scripts/publish_prerelease.py --directory release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-prerelease
          path: release
          if-no-files-found: ignore

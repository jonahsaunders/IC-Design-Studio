name: IHP coil physical qualification
on:
  workflow_dispatch:
  push:
    branches: [main, experimental]
    paths:
      - 'icstudio/**'
      - 'scripts/qualify_ihp_inductor_layouts.py'
      - 'scripts/qualify_ihp_varactor_layouts.py'
      - 'scripts/qualify_ihp_npn_layouts.py'
      - 'scripts/qualify_ihp_topvia.py'
      - 'tests/test_ihp_em_profile.py'
      - 'scripts/audit_ihp_measured_reference.py'
      - 'tests/test_ihp_measured_reference.py'
      - 'tests/fixtures/ihp-measured-coil-v1/**'
      - 'scripts/run_ihp_measured_coil.py'
      - 'tests/test_ihp_measured_workflow.py'
      - 'tests/fixtures/ihp-measured-workflow-v1/**'
      - 'requirements-qualification.txt'
      - 'scripts/qualify_ihp_mixed_layouts.py'
      - 'tests/test_ihp_mixed_layouts.py'
      - 'scripts/build_physical_engines.py'
      - 'tests/test_ihp_inductor_lvs.py'
      - 'tests/test_ihp_varactor_lvs.py'
      - 'tests/test_ihp_varactor_rules.py'
      - 'tests/test_ihp_varactor_context.py'
      - 'tests/test_ihp_klayout_drc.py'
      - 'tests/test_ihp_npn_qualification.py'
      - 'requirements.txt'
      - '.github/workflows/ihp-inductor-qualification.yml'
  pull_request:
    paths:
      - 'icstudio/**'
      - 'scripts/qualify_ihp_inductor_layouts.py'
      - 'scripts/qualify_ihp_varactor_layouts.py'
      - 'scripts/qualify_ihp_npn_layouts.py'
      - 'scripts/qualify_ihp_topvia.py'
      - 'tests/test_ihp_em_profile.py'
      - 'scripts/audit_ihp_measured_reference.py'
      - 'tests/test_ihp_measured_reference.py'
      - 'tests/fixtures/ihp-measured-coil-v1/**'
      - 'scripts/run_ihp_measured_coil.py'
      - 'tests/test_ihp_measured_workflow.py'
      - 'tests/fixtures/ihp-measured-workflow-v1/**'
      - 'requirements-qualification.txt'
      - 'scripts/qualify_ihp_mixed_layouts.py'
      - 'tests/test_ihp_mixed_layouts.py'
      - 'scripts/build_physical_engines.py'
      - 'tests/test_ihp_inductor_lvs.py'
      - 'tests/test_ihp_varactor_lvs.py'
      - 'tests/test_ihp_varactor_rules.py'
      - 'tests/test_ihp_varactor_context.py'
      - 'tests/test_ihp_klayout_drc.py'
      - 'tests/test_ihp_npn_qualification.py'
      - 'requirements.txt'
      - '.github/workflows/ihp-inductor-qualification.yml'
# Replace obsolete branch/PR checks. A distinct file prefix prevents reusable
# workflows from cancelling their callers; release preparation, tags and manual
# runs use a unique run id so their acceptance evidence can finish.
concurrency:
  group: >-
    ci-ihp-inductor-qualification-${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.workflow != 'Prepare desktop release' && github.ref) || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  physical-coils:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config m4 tcl-dev tk-dev libx11-dev libxrender-dev libxpm-dev libcairo2-dev libglu1-mesa-dev klayout libegl1 libopengl0
          curl -fL --retry 3 -o /tmp/ihp-klayout.deb https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.5-1_amd64.deb
          echo '9f88fe45d1992fc9bd0ce986bbbe150ad198c6a59a86fc13343db822a5790e49  /tmp/ihp-klayout.deb' | sha256sum -c
          sudo apt-get install -y /tmp/ihp-klayout.deb
          python -m pip install -r requirements.txt -r requirements-qualification.txt
      - name: Verify public measured reference and layout exchange without an EM solve
        run: |
          python -m unittest tests.test_ihp_measured_reference tests.test_ihp_measured_workflow -v
          python scripts/audit_ihp_measured_reference.py --output build/ihp-measured-reference.json --exchange-output build/ihp-measured-layout
      - name: Build pinned Magic and Netgen
        run: python scripts/build_physical_engines.py --output build/physical-engines
      - name: Check coil topology, interfaces and lossless stream handling
        run: python -m unittest tests.test_ihp_inductor_lvs tests.test_ihp_varactor_lvs tests.test_ihp_varactor_rules tests.test_ihp_varactor_context tests.test_ihp_klayout_drc tests.test_ihp_npn_qualification tests.test_ihp_em_profile tests.test_ihp_mixed_layouts -v
      - name: Require eight legal orientations and twenty-eight detected faults
        timeout-minutes: 10
        run: python scripts/qualify_ihp_inductor_layouts.py --sources icstudio/assets/qualification/ihp-inductors --output build/ihp-coil-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --klayout /usr/bin/klayout
      - name: Require forty contacted varactor layouts and twenty-eight detected faults
        timeout-minutes: 10
        run: python scripts/qualify_ihp_varactor_layouts.py --size small --contacted --workers 2 --output build/ihp-varactor-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --klayout /usr/bin/klayout
      - name: Require eighty original varactor layouts and sixty-four detected faults with both public decks
        timeout-minutes: 15
        run: python scripts/qualify_ihp_varactor_layouts.py --drc-engine ihp-public --workers 2 --output build/ihp-public-varactor-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --klayout /usr/bin/klayout
      - name: Check all three NPN families with preserved public annotations
        # Hosted run 39525709861 reported all nine cases at 15m05s, then
        # timed out before the final source/package integrity checks completed.
        timeout-minutes: 25
        run: python scripts/qualify_ihp_npn_layouts.py --drc-engine ihp-public --package icstudio/assets/pdks/ihp-sg13g2 --workers 2 --output build/ihp-public-npn-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --klayout /usr/bin/klayout
      - name: Check top-metal via geometry and five deliberate faults
        timeout-minutes: 5
        run: python scripts/qualify_ihp_topvia.py --klayout /usr/bin/klayout --output build/ihp-topvia-evidence
      - name: Require twelve mixed NPN and small/large-varactor layouts and twenty-seven detected faults
        timeout-minutes: 15
        run: python scripts/qualify_ihp_mixed_layouts.py --workers 2 --output build/ihp-mixed-evidence --magic "$PWD/build/physical-engines/installed/bin/magic" --netgen "$PWD/build/physical-engines/installed/bin/netgen" --klayout /usr/bin/klayout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ihp-coil-physical-evidence
          path: |
            build/ihp-coil-evidence
            build/ihp-varactor-evidence
            build/ihp-public-varactor-evidence
            build/ihp-public-npn-evidence
            build/ihp-topvia-evidence
            build/ihp-mixed-evidence
            build/ihp-measured-reference.json
            build/ihp-measured-layout
            build/physical-engines/*-build.log
            build/physical-engines/*-version.log
            build/physical-engines/source-lock.json
          if-no-files-found: error

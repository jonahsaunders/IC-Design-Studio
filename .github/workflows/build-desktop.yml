name: Build and verify desktop release
on:
  workflow_call:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main, experimental]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install Linux simulation engine and desktop runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice xschem libegl1 libopengl0 libgl1 libglx0 libglvnd0 \
            libx11-6 libxcb1 libxcb-image0 libxcb-xkb1 libxcb-cursor0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-icccm4 libxcb-util1 \
            libxcb-shape0 libxkbcommon-x11-0 xvfb xauth libgl1-mesa-dri libglx-mesa0
          echo "ICSTUDIO_TEST_NGSPICE=$(command -v ngspice)" >> "$GITHUB_ENV"
          echo "ICSTUDIO_BUNDLED_NGSPICE=$(command -v ngspice)" >> "$GITHUB_ENV"
      - name: Stage verified Windows simulation engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install py7zr==1.1.3
          python scripts/stage_windows_ngspice.py --ensure
          if ($LASTEXITCODE -ne 0) { throw 'Runtime provisioning failed.' }
          $engine = (Resolve-Path 'icstudio/assets/runtime/ngspice/ngspice.exe').Path
          "ICSTUDIO_TEST_NGSPICE=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify bundled simulation PDKs
        run: python scripts/check_simulation_assets.py
      - name: Validate supplied GF180 bandgap startup
        run: python scripts/verify_bundled_simulation.py --output build/bundled-simulation-evidence
      - name: Compare six-case testbench with independent Xschem simulation
        if: runner.os == 'Linux'
        run: python scripts/verify_bandgap_compatibility.py --output build/bandgap-compatibility-evidence
      - name: Build optional native core
        run: python scripts/build_native.py
      - name: Test core
        id: core_tests
        run: python -m unittest discover -s tests -v
      - name: Qualify parameterized native hierarchy
        run: python scripts/verify_native_hierarchy.py --output build/native-hierarchy-evidence
      - name: Qualify large layouts, schematic-driven changes and concurrent editors
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_layout_expansion.py --out build/layout-expansion-evidence
      - name: Check repository release materials
        run: python scripts/check_release.py
      - name: Test 3D layout software viewer
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_layout_3d.py --out build/layout-3d-evidence
      - name: Test 3D layout OpenGL rendering
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python tests/gui_layout_3d.py --require-opengl --out build/layout-3d-opengl-evidence
      - name: Test guided examples and PDK setup
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_getting_started.py --evidence build/getting-started-evidence
      - name: Test native interface
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_smoke.py
      - name: Qualify native migration with real simulation
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_native_migration.py --evidence build/native-migration-evidence
      - name: Qualify graphical native analyses and exchange
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_native_workflows.py --evidence build/native-workflow-evidence
      - name: Test catalog migration and dependency linking
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_catalog_migration.py
      - name: Run six-case native testbench through the desktop interface
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_bandgap_compatibility.py
      - name: Test project hub and installed PDK revisions
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_project_hub.py
      - name: Test new desktop workflows
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_workflows.py
      - name: Test manual wiring and keyboard commands
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_wiring.py
      - name: Test net labels and grounds
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_labels.py
      - name: Test recovery and job lifecycle
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_reliability.py
      - name: Test labels in a narrow canvas
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_labels.py --compact-canvas
      - name: Test project and PDK workspace
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_project_pdk.py
      - name: Test lifecycle and reusable components
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_lifecycle.py
      - name: Test desktop usability
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_usability.py
      - name: Test linked layout workflow
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_silicon.py
      - name: Test saved testbenches and physical hierarchy
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_hierarchy.py
      - name: Test hierarchy drawing in a narrow canvas
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_hierarchy.py --compact-canvas
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Package Linux
        if: runner.os == 'Linux'
        run: python scripts/package.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_windows.ps1
      - name: Verify frozen Linux app
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/ICDesignStudio/ICDesignStudio --release-test build/frozen-evidence
      - name: Assemble and execute release archives
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/prepare_release_payload.py --output build/release-payload
      - name: Retain release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: build/release-payload
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ICDesignStudio-${{ matrix.os }}
          path: |
            dist/ICDesignStudio
            dist/installers
            build/windows-evidence
            build/frozen-evidence
            build/native-migration-evidence
            build/native-workflow-evidence
            build/getting-started-evidence
            build/bundled-simulation-evidence
            build/bandgap-compatibility-evidence
            build/bandgap-gui-evidence
            build/project-hub-evidence
            build/label-evidence
            build/project-pdk-evidence
            build/layout-expansion-evidence
            build/layout-3d-evidence
            build/layout-3d-opengl-evidence
            build/native-hierarchy-evidence
            build/distribution-evidence
            build/verification-0.8.0

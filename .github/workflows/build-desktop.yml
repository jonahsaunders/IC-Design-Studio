name: Build and verify desktop release
on:
  workflow_call:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main, experimental]
  pull_request:
permissions:
  contents: read
jobs:
  digital-runtime:
    uses: ./.github/workflows/digital-runtime.yml
  package:
    needs: digital-runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: digital-runtime-payload
          path: build/digital-payload
      - name: Prepare Windows Linux support for the included runtime
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          # WSL opens its first-run welcome window when the runtime is imported.
          # It can steal native pointer input from the installed-app DPI probe.
          # Mark onboarding complete for this disposable CI user before any WSL
          # setup; keep real native input checks enabled at every scale factor.
          # https://github.com/microsoft/WSL/blob/bc5abef10cc49b8d58c6ee93d8da066f76d225be/src/windows/service/exe/LxssUserSession.cpp
          $wslKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss'
          New-Item -Path $wslKey -Force -ErrorAction Stop | Out-Null
          New-ItemProperty -Path $wslKey -Name OOBEComplete -PropertyType DWord -Value 1 -Force -ErrorAction Stop | Out-Null
          if ((Get-ItemPropertyValue -Path $wslKey -Name OOBEComplete -ErrorAction Stop) -ne 1) {
            throw 'Could not suppress WSL onboarding on the CI desktop.'
          }
          # Reuse a working runner installation. Updating unconditionally makes
          # every build depend on the WSL download service (which can return 403).
          # https://learn.microsoft.com/en-us/windows/wsl/basic-commands
          wsl --status
          if ($LASTEXITCODE -ne 0) {
            wsl --update --web-download
            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'WSL web download failed; trying the Microsoft Store update channel.'
              wsl --update
              if ($LASTEXITCODE -ne 0) { throw 'WSL setup failed through both update channels.' }
            }
            wsl --status
            if ($LASTEXITCODE -ne 0) { throw 'WSL is still unavailable after updating.' }
          }
          # The mandatory digital-runtime qualification below imports a WSL 2
          # distribution and runs the included engines before packaging.
      - name: Configure Windows virtual desktop for native DPI checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The included toolchain makes compilation long enough to reach the
          # runner's display idle timeout. Native pointer tests need its display.
          powercfg /change monitor-timeout-ac 0
          if ($LASTEXITCODE -ne 0) { throw 'Could not keep the CI display available.' }
          powercfg /change standby-timeout-ac 0
          if ($LASTEXITCODE -ne 0) { throw 'Could not keep the CI runner awake.' }
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-DisplayResolution
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify windowed Windows worker pipes
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_windows_stdio -v
      - name: Verify cross-platform installation and path contracts
        run: python -m unittest tests.test_digital_runtime tests.test_digital_tools -v
      - name: Verify installed digital runtime on this operating system
        env:
          ICSTUDIO_DIGITAL_STATE: ${{ github.workspace }}/build/digital-state
        run: python scripts/qualify_digital_runtime.py
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build pinned offline VGA Playground
        run: python scripts/build_vga_playground.py --test
      - name: Install Linux simulation engine and desktop runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice xschem libegl1 libopengl0 libgl1 libglx0 libglvnd0 \
            libx11-6 libxtst6 libxkbfile1 libnss3 libasound2t64 libxcb1 libxcb-image0 libxcb-xkb1 libxcb-cursor0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-icccm4 libxcb-util1 \
            libxcb-shape0 libxkbcommon-x11-0 xvfb xauth openbox x11-utils libgl1-mesa-dri libglx-mesa0 \
            build-essential cmake libhdf5-dev libvtk9-dev libboost-all-dev libcgal-dev libtinyxml-dev
          echo "ICSTUDIO_TEST_NGSPICE=$(command -v ngspice)" >> "$GITHUB_ENV"
          echo "ICSTUDIO_BUNDLED_NGSPICE=$(command -v ngspice)" >> "$GITHUB_ENV"
      - name: Stage verified Windows simulation engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install py7zr==1.1.3
          python scripts/stage_windows_ngspice.py --ensure
          if ($LASTEXITCODE -ne 0) { throw 'Runtime provisioning failed.' }
          $engine = (Resolve-Path 'icstudio/assets/runtime/ngspice/ngspice.exe').Path
          "ICSTUDIO_TEST_NGSPICE=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Cache included openEMS runtime
        uses: actions/cache@v4
        with:
          path: |
            build/openems-runtime
            build/openems-downloads
          key: openems-${{ runner.os }}-${{ hashFiles('scripts/stage_openems.py', 'icstudio/openems_runtime.py') }}
          restore-keys: openems-${{ runner.os }}-
      - name: Prepare included open-source openEMS and Python
        timeout-minutes: 30
        run: python scripts/stage_openems.py
      - name: Run the included native openEMS solver
        timeout-minutes: 12
        run: python tests/probe_openems.py --out build/openems-native-evidence
      - name: Check native Windows experimental gestures and inductor creator at 200 percent before packaging
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '2'
        run: python tests/gui_experimental.py --out build/native-experimental-evidence
      - name: Verify bundled simulation PDKs
        run: python scripts/check_simulation_assets.py
      - name: Validate supplied GF180 bandgap startup
        run: python scripts/verify_bundled_simulation.py --output build/bundled-simulation-evidence
      - name: Compare six-case testbench with independent Xschem simulation
        if: runner.os == 'Linux'
        run: python scripts/verify_bandgap_compatibility.py --output build/bandgap-compatibility-evidence
      - name: Build optional native core
        run: python scripts/build_native.py
      - name: Test core
        id: core_tests
        run: python -m unittest discover -s tests -v
      - name: Qualify parameterized native hierarchy
        run: python scripts/verify_native_hierarchy.py --output build/native-hierarchy-evidence
      - name: Qualify large layouts, schematic-driven changes and concurrent editors
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_layout_expansion.py --out build/layout-expansion-evidence
      - name: Check repository release materials
        run: python scripts/check_release.py
      - name: Test component browsing, selection, layout transfer and floating panels
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_feedback.py --out build/usability-feedback-evidence
      - name: Test experimental workflow, window recovery and inductor creator
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_experimental.py --out build/experimental-evidence
      - name: Test via placement and Autovia through the layout editor
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_layout_vias.py --out build/layout-vias-evidence
      - name: Test live desktop collaboration with three editors
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_live_collaboration.py --out build/live-collaboration-evidence
      - name: Test button-driven local server setup and saved-workspace restart
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_local_collaboration.py --out build/local-collaboration-evidence
      - name: Test precise editing, test plans, baselines and workflow guidance
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_professional_workflows.py --out build/professional-workflow-evidence
      - name: Test analog workspace, saved-run inspection and requirement retries
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_analog_workspace.py --out build/analog-workspace-evidence
      - name: Test analog optimizer and workspace accessibility
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_analog_optimizer.py --out build/analog-optimizer-evidence
      - name: Test guided analog design, adaptive search and device lookup
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_analog_experiments.py --out build/analog-experiment-evidence
      - name: Test workspace recovery, richer device data and staged searches
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_optimizer_refinement.py --out build/optimizer-refinement-evidence
      - name: Qualify advanced analog optimization and staged verification
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_analog_advanced.py --out build/analog-advanced-evidence
      - name: Test encrypted hosting, peer trust and direct annotation editing
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_host_annotations.py --out build/host-annotation-evidence
      - name: Test shared schematics, connectivity, hierarchy and desktop recovery
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_schematic_collaboration.py --out build/schematic-collaboration-evidence
      - name: Test automatic workflows, linked change review and reviewer discussions
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_workflow_review.py --out build/workflow-review-evidence
      - name: Test asynchronous durable recovery and failed-storage handling
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_layout_stability.py --out build/recovery-workflow-evidence
      - name: Test 3D layout software viewer
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_layout_3d.py --out build/layout-3d-evidence
      - name: Test 3D layout OpenGL rendering
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python tests/gui_layout_3d.py --require-opengl --out build/layout-3d-opengl-evidence
      - name: Test guided examples and PDK setup
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_getting_started.py --evidence build/getting-started-evidence
      - name: Verify digital first-run guidance and safe continuation
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_digital_first_run.py
      - name: Test native interface
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_smoke.py
      - name: Qualify native migration with real simulation
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_native_migration.py --evidence build/native-migration-evidence
      - name: Qualify graphical native analyses and exchange
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_native_workflows.py --evidence build/native-workflow-evidence
      - name: Test catalog migration and dependency linking
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_catalog_migration.py
      - name: Run six-case native testbench through the desktop interface
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_bandgap_compatibility.py
      - name: Test project hub and installed PDK revisions
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_project_hub.py
      - name: Test new desktop workflows
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_workflows.py
      - name: Test manual wiring and keyboard commands
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_wiring.py
      - name: Test net labels and grounds
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_labels.py
      - name: Test recovery and job lifecycle
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_reliability.py
      - name: Test labels in a narrow canvas
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_labels.py --compact-canvas
      - name: Test project and PDK workspace
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_project_pdk.py
      - name: Test lifecycle and reusable components
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_lifecycle.py
      - name: Test desktop usability
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_usability.py
      - name: Test linked layout workflow
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_silicon.py
      - name: Test saved testbenches and physical hierarchy
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_hierarchy.py
      - name: Test hierarchy drawing in a narrow canvas
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_hierarchy.py --compact-canvas
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Package Linux
        if: runner.os == 'Linux'
        run: python scripts/package.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Qualify included digital engines through the frozen desktop
        timeout-minutes: 20
        env:
          ICSTUDIO_DIGITAL_STATE: ${{ github.workspace }}/build/digital-state
        run: python scripts/verify_frozen_digital.py
      - name: Verify installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_windows.ps1
      - name: Verify frozen Linux app
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/ICDesignStudio/ICDesignStudio --release-test build/frozen-evidence
      - name: Verify frozen Linux app under X11 with a window manager at 150 percent scaling
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: xcb
          QT_SCALE_FACTOR: '1.5'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 2560x1600x24" python scripts/verify_linux_x11.py
      - name: Assemble and execute release archives
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/prepare_release_payload.py --output build/release-payload
      - name: Retain release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: build/release-payload
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-diagnostics-${{ runner.os }}
          path: |
            build/analog-experiment-evidence
            build/optimizer-refinement-evidence
            build/analog-advanced-evidence
            build/digital-frozen-evidence
            build/distribution-evidence/vga
            build/windows-evidence/vga
            build/digital-first-run-ui
            build/windows-evidence/install.log
            build/windows-evidence/uninstall.log
            build/windows-evidence/windows-release.json
            build/windows-evidence/dpi-*/*.json
            build/windows-evidence/dpi-*/experimental/*.png
            build/native-experimental-evidence/**/*.json
            build/native-experimental-evidence/**/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ICDesignStudio-${{ matrix.os }}
          path: |
            dist/ICDesignStudio
            dist/installers
            build/windows-evidence
            build/frozen-evidence
            build/x11-evidence
            build/native-migration-evidence
            build/native-workflow-evidence
            build/getting-started-evidence
            build/bundled-simulation-evidence
            build/bandgap-compatibility-evidence
            build/bandgap-gui-evidence
            build/project-hub-evidence
            build/label-evidence
            build/project-pdk-evidence
            build/layout-expansion-evidence
            build/layout-vias-evidence
            build/live-collaboration-evidence/report.json
            build/live-collaboration-evidence/*.png
            build/local-collaboration-evidence/report.json
            build/local-collaboration-evidence/*.png
            build/host-annotation-evidence/report.json
            build/host-annotation-evidence/*.png
            build/professional-workflow-evidence/report.json
            build/professional-workflow-evidence/*.png
            build/schematic-collaboration-evidence/report.json
            build/schematic-collaboration-evidence/*.png
            build/workflow-review-evidence/report.json
            build/workflow-review-evidence/*.png
            build/usability-feedback-evidence
            build/experimental-evidence
            build/native-experimental-evidence
            build/recovery-workflow-evidence/gui-stability.json
            build/layout-3d-evidence
            build/layout-3d-opengl-evidence
            build/native-hierarchy-evidence
            build/openems-native-evidence/report.json
            build/openems-native-evidence/*.log
            build/digital-frozen-evidence
            build/distribution-evidence
            build/verification-0.8.0

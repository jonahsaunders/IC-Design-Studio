name: Bug report
description: Report a reproducible problem with a design or workflow.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Application version and package
      placeholder: "0.21.0, Windows portable / source checkout"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and display scaling
      placeholder: "Windows 11 x64, 150% scaling"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result
      description: Include the menu or control used and what happened instead.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Small reproducer and run log
      description: Attach a small shareable project and the failed run's log. Include engine version and PDK revision where relevant. Remove private design data and personal paths.
  - type: textarea
    id: regression
    attributes:
      label: Previous working version or workaround
